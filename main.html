<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка: Заблокировано Роскомнадзором</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c2f38;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            animation: bgAnimation 5s infinite alternate;
        }
        h1 {
            font-size: 50px;
            color: #e63946;
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        p {
            font-size: 20px;
            margin-bottom: 40px;
            animation: fadeIn 2s ease-in-out;
        }
        .container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .image-container {
            position: relative;
            margin-bottom: 30px;
            animation: moveUp 2s ease-out;
        }
        .image-container img {
            width: 150px;
            height: auto;
            animation: shake 1.5s ease-in-out infinite;
        }
        .error-code {
            font-size: 100px;
            color: #f1faee;
            font-weight: bold;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        .rkn-logo {
            width: 50px;
            height: auto;
            margin-top: 20px;
        }
        .buttons {
            margin-top: 30px;
            animation: fadeIn 3s ease-in-out;
        }
        .button {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #d62828;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes moveUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes bgAnimation {
            0% { background-color: #2c2f38; }
            50% { background-color: #1d2128; }
            100% { background-color: #2c2f38; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Coat_of_arms_of_Russia.svg/800px-Coat_of_arms_of_Russia.svg.png" alt="Роскомнадзор">
        </div>
        <h1>Ошибка</h1>
        <div class="error-code">403</div>
        <p>Доступ к этому ресурсу ограничен Роскомнадзором.</p>
        <p>Мы не можем показать вам эту страницу.</p>
        <div class="buttons">
            <button class="button" onclick="window.location.href='https://rkn.gov.ru/'">Посетить сайт Роскомнадзора</button>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>502 Bad Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://img.icons8.com/ios-filled/50/ffffff/error.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      user-select: none;
      height: 100%;
    }

    /* Космос */
    .stars, .stars2, .stars3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-repeat: repeat;
      z-index: -3;
      animation: moveStars 200s linear infinite;
    }

    .stars {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 2px 2px;
      opacity: 0.3;
    }

    .stars2 {
      background-image: radial-gradient(#ff4d4d 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.2;
    }

    .stars3 {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 1.5px 1.5px;
      opacity: 0.1;
    }

    @keyframes moveStars {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    /* Туман */
    .fog {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03), rgba(255,0,0,0.05));
      animation: fogMove 60s linear infinite;
      z-index: -2;
    }

    @keyframes fogMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Горизонтальный терминал */
    .terminal-container {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      text-align: left;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 2px solid #ff4d4d;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal {
      background-color: #000;
      color: #fff;
      font-size: 1.2em;
      line-height: 1.6em;
      white-space: pre-wrap;
      padding: 20px;
      font-family: 'Courier New', Courier, monospace;
      border: none;
      width: 100%;
      overflow-x: auto;
      border-radius: 5px;
      margin-bottom: 10px;
      max-height: 300px;
      animation: typingEffect 4s steps(80, end);
    }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.2em;
      background: #ff4d4d;
      margin-left: 5px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    @keyframes typingEffect {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Эффект кнопки ввода */
    .input-container {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
    }

    input[type="text"] {
      background: #000;
      color: #fff;
      border: 2px solid #ff4d4d;
      padding: 10px;
      width: 85%;
      font-size: 1.1em;
      font-family: 'Courier New', Courier, monospace;
      border-radius: 5px;
    }

    button {
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      padding: 10px 15px;
      font-size: 1.1em;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff1a1a;
    }

    /* Бинарный поток */
    .binary-stream {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 1.1em;
      color: #ff4d4d;
      white-space: nowrap;
      overflow: hidden;
    }

    .binary-text {
      display: inline-block;
      animation: typing 3s steps(60, end), fadeOut 1s ease-in 5s forwards;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    *::selection {
      background: none;
    }

    /* Для мобильных устройств */
    @media screen and (max-width: 600px) {
      .terminal-container {
        width: 100%;
        padding: 10px;
      }

      .terminal {
        font-size: 1em;
      }

      input[type="text"] {
        width: 75%;
        font-size: 1em;
        padding: 8px;
      }

      button {
        padding: 8px 12px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return disableKeys(event)">

  <!-- Фон (космос) -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="fog"></div>

  <!-- Горизонтальный терминал -->
  <div class="terminal-container">
    <div class="terminal" id="terminal">
      Подключение к серверу...<br>
      Ответ не получен...<br>
      Запрос повторяется...<br>
      Ошибка шлюза 502.<br>
      Возможные причины:<br>
      • Перегрузка сервера<br>
      • Неправильная маршрутизация<br>
      • Отказ вышестоящего сервера<br><br>
      Попробуйте позже или сообщите администратору.
      <span class="cursor"></span>
    </div>

    <!-- Ввод команды -->
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Введите команду..." autocomplete="off" autofocus>
      <button id="sendButton">Отправить</button>
    </div>
  </div>

  <!-- Бинарный поток -->
  <div class="binary-stream">
    <span class="binary-text" id="binaryText">0101010101010101010101010101010101010101010101010101010101</span>
  </div>

  <script>
    // Защита от копирования
    function disableKeys(e) {
      const blocked = ['u', 'c', 'x', 'v', 'a', 's'];
      if (e.ctrlKey && blocked.includes(e.key.toLowerCase())) return false;
      if (e.key === 'F12') return false;
    }

    // Эмулируем команду ввода в терминале
    let terminal = document.getElementById('terminal');
    let cursor = document.querySelector('.cursor');
    let userInput = document.getElementById('userInput');
    let sendButton = document.getElementById('sendButton');

    // Симуляция ввода команды
    function simulateTerminalInput(command) {
      terminal.innerHTML += '<br/>$ ' + command;
      setTimeout(() => {
        if (command === 'ls') {
          terminal.innerHTML += '<br/>Невозможно выполнить команду: недостаточно прав.';
        } else {
          terminal.innerHTML += '<br/>Команда не найдена.';
        }
        terminal.innerHTML += '<br/>';
        terminal.scrollTop = terminal.scrollHeight; // Автопрокрутка
      }, 1000);
    }

    // Обработчик отправки команды
    sendButton.addEventListener('click', () => {
      let command = userInput.value;
      if (command) {
        simulateTerminalInput(command);
        userInput.value = ''; // Очищаем поле
      }
    });

    // Слушаем Enter для отправки команды
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });

    terminal.innerHTML += '<br/>$ '; // Нач

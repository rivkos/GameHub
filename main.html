<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка подключения</title>
    <style>
        /* Основные стили для страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #f1f1f1, #e0e0e0);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* Контейнер с ошибкой */
        .error-container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 650px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s ease-out forwards; /* Анимация появления */
        }

        /* Иконка браузера */
        .browser-icon {
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            margin: 20px auto;
            animation: bounce 1.5s infinite alternate; /* Анимация подпрыгивания */
        }

        /* Иконки браузеров */
        .chrome { background-image: url('https://upload.wikimedia.org/wikipedia/commons/a/a7/Google_Chrome_icon_%282013-2019%29.svg'); }
        .firefox { background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Mozilla_Firefox_logo_2017.svg'); }
        .yandex { background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d2/Yandex_logo_2013.svg'); }

        /* Текст ошибки */
        h1 {
            font-size: 36px;
            color: #d9534f;
            margin-top: 20px;
            opacity: 0;
            animation: fadeInText 1s ease-out forwards;
        }

        .error-text {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInText 1.5s ease-out forwards;
        }

        .error-text a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .error-text a:hover {
            color: #0056b3;
        }

        /* Отключение выделения текста */
        body, .error-container {
            user-select: none;
        }

        /* Отключение правого клика */
        .no-right-click {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Анимация для появления контейнера */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Анимация подпрыгивания иконки */
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-20px);
            }
        }

        /* Анимация текста */
        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .browser-icon {
                width: 100px;
                height: 100px;
            }

            .error-container {
                padding: 30px 40px;
            }

            .error-text {
                font-size: 16px;
            }
        }

        /* Версия для телефонов */
        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            .browser-icon {
                width: 80px;
                height: 80px;
            }

            .error-container {
                padding: 20px 30px;
            }

            .error-text {
                font-size: 14px;
            }
        }

    </style>
    <script>
        // Функция для определения браузера
        function getBrowser() {
            let userAgent = navigator.userAgent;

            if (/Chrome/.test(userAgent) && /Google Inc/.test(navigator.vendor)) {
                return 'chrome';
            } else if (/Firefox/.test(userAgent)) {
                return 'firefox';
            } else if (/YaBrowser/.test(userAgent)) {
                return 'yandex';
            } else {
                return 'other';
            }
        }

        // Функция для настройки страницы под браузер
        function setBrowserSpecificContent() {
            const browser = getBrowser();
            const container = document.querySelector('.error-container');
            const icon = document.querySelector('.browser-icon');
            const errorText = document.querySelector('.error-text');

            if (browser === 'chrome') {
                icon.classList.add('chrome');
                container.style.backgroundColor = '#f1f1f1';
                errorText.innerHTML = 'Пожалуйста, проверьте ваше интернет-соединение и попробуйте снова.<br><a href="https://support.google.com/chrome">Поддержка Chrome</a>';
            } else if (browser === 'firefox') {
                icon.classList.add('firefox');
                container.style.backgroundColor = '#f2f2f2';
                errorText.innerHTML = 'Ошибка подключения в Firefox. Проверьте ваше соединение.<br><a href="https://support.mozilla.org">Поддержка Firefox</a>';
            } else if (browser === 'yandex') {
                icon.classList.add('yandex');
                container.style.backgroundColor = '#f6f6f6';
                errorText.innerHTML = 'Нет соединения с интернетом. Пожалуйста, попробуйте снова.<br><a href="https://browser.yandex.ru/support">Поддержка Yandex Browser</a>';
            } else {
                container.style.backgroundColor = '#e8e8e8';
                errorText.innerHTML = 'Пожалуйста, проверьте ваше интернет-соединение и попробуйте снова.';
            }
        }

        // Настройка страницы при загрузке
        window.onload = setBrowserSpecificContent;
    </script>
</head>
<body>

    <div class="error-container">
        <!-- Иконка браузера -->
        <div class="browser-icon"></div>
        <h1>Нет подключения к интернету</h1>
        <p class="error-text">Загрузка...</p>
    </div>

</body>
</html>

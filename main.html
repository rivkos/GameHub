<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заблокировано Роскомнадзором</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: bgAnimation 10s infinite alternate;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 48px;
            color: #e63946;
            animation: fadeIn 2s ease-in-out;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #f1faee;
            animation: bounce 1.5s infinite;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #dfe6e9;
            animation: fadeIn 2s ease-in-out;
        }

        .rkn-tan {
            width: 200px;
            height: auto;
            margin-bottom: 30px;
            animation: slideIn 2s ease-in-out;
        }

        .button {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            animation: fadeIn 3s ease-in-out;
        }

        .button:hover {
            background-color: #d62828;
        }

        .button:focus {
            outline: none;
        }

        .rkn-logo {
            width: 50px;
            height: auto;
            margin-top: 20px;
        }

        /* Защита от копирования и выделения текста */
        body {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Защита от правого клика */
        body {
            -webkit-touch-callout: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes bgAnimation {
            0% { background: linear-gradient(135deg, #2c3e50, #34495e); }
            50% { background: linear-gradient(135deg, #1d2128, #2c3e50); }
            100% { background: linear-gradient(135deg, #2c3e50, #34495e); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ошибка 403</h1>
        <div class="error-code">403</div>
        <p>Доступ к этому ресурсу ограничен Роскомнадзором.</p>
        <p>Мы не можем показать вам эту страницу.</p>
        <button class="button" onclick="window.location.href='https://rkn.gov.ru/'">Перейти на сайт Роскомнадзора</button>
        <div>
        
        </div>
    </div>

    <script>
        // Защита от правого клика
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Защита от выделения текста
        document.onselectstart = function() {
            return false;
        };

        // Защита от копирования
        document.addEventListener('copy', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>

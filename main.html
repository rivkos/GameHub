<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка подключения</title>
    <style>
        /* Основные стили для страницы */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* Стиль для блока с ошибкой */
        .error-container {
            text-align: center;
            background-color: #fff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out forwards; /* Анимация появления */
        }

        /* Иконка для браузеров */
        .error-container .browser-icon {
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            margin: 20px auto;
            animation: bounce 1.5s infinite alternate; /* Анимация подпрыгивания */
        }

        /* Имитация иконок браузеров */
        .chrome { background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Google_Chrome_icon_%282013-2019%29.svg/120px-Google_Chrome_icon_%282013-2019%29.svg.png'); }
        .firefox { background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Mozilla_Firefox_logo_2017.svg/120px-Mozilla_Firefox_logo_2017.svg.png'); }
        .yandex { background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Yandex_logo_2013.svg/120px-Yandex_logo_2013.svg.png'); }

        /* Стиль фона для страницы */
        .error-background {
            background-color: #f2f2f2;
            background-image: url('https://www.gstatic.com/images/branding/product/1x/chrome_logo_color_48dp.png');
            background-size: 80px 80px;
            background-repeat: no-repeat;
            background-position: center;
            padding-top: 50px;
            animation: backgroundAnimation 10s linear infinite; /* Анимация фона */
        }

        /* Стиль для текста ошибки */
        .error-text {
            font-size: 20px;
            color: #404040;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInText 2s ease-out forwards;
        }

        .error-text a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .error-text a:hover {
            color: #0056b3;
        }

        /* Блокировка копирования и выделения */
        body, .error-container {
            user-select: none; /* Отключаем выделение текста */
        }

        /* Отключение правого клика */
        .no-right-click {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Анимация появления текста */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Анимация подпрыгивания иконки */
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-20px);
            }
        }

        /* Анимация фона */
        @keyframes backgroundAnimation {
            0% {
                background-position: center;
            }
            50% {
                background-position: top left;
            }
            100% {
                background-position: center;
            }
        }

        /* Анимация появления текста */
        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
    <script>
        // Защита от правого клика
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Защита от выделения текста
        document.addEventListener('selectstart', function (e) {
            e.preventDefault();
        });

        // Защита от копирования
        document.addEventListener('copy', function (e) {
            e.preventDefault();
            alert("Копирование контента отключено!");
        });
    </script>
</head>
<body class="error-background">

    <div class="error-container">
        <!-- Иконка браузера -->
        <div class="browser-icon chrome"></div>
        <h1>Нет подключения к интернету</h1>
        <p class="error-text">Пожалуйста, проверьте ваше интернет-соединение и попробуйте снова.</p>
        <p class="error-text">Для получения помощи посетите <a href="https://support.google.com/chrome" target="_blank">страницу поддержки</a>.</p>
    </div>

</body>
</html>

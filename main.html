<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>502 Bad Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    /* Космос фон */
    .stars, .stars2, .stars3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-repeat: repeat;
      z-index: -1;
      animation: moveStars 200s linear infinite;
    }

    .stars {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 2px 2px;
      opacity: 0.4;
    }

    .stars2 {
      background-image: radial-gradient(#ff4d4d 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.3;
    }

    .stars3 {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 1.5px 1.5px;
      opacity: 0.1;
    }

    @keyframes moveStars {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      animation: fadeIn 2s ease-out;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      fill: #ff4d4d;
      animation: bounce 2s infinite;
    }

    h1 {
      font-size: 3em;
      color: #ff4d4d;
      margin: 0;
      text-shadow: 0 0 10px red;
    }

    p {
      font-size: 1.2em;
      color: #fff;
      margin: 15px 0 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6em;
      animation: slideUp 2s ease-out;
    }

    .binary-stream {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #ff4d4d;
      font-size: 1.1em;
      white-space: nowrap;
      overflow: hidden;
    }

    .binary-text {
      display: inline-block;
      animation: typing 3s steps(60, end), fadeOut 1s ease-in 4.5s forwards;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    *::selection {
      background: none;
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return disableKeys(event)">

  <!-- Космос фон -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="container">
    <svg class="icon" viewBox="0 0 64 64">
      <path d="M32 0C14.4 0 0 14.4 0 32s14.4 32 32 32 32-14.4 32-32S49.6 0 32 0zm0 58C17 58 6 47 6 32S17 6 32 6s26 11 26 26-11 26-26 26z"/>
      <path d="M30 16h4v20h-4zm0 24h4v4h-4z"/>
    </svg>
    <h1>502 Bad Gateway</h1>
    <p>Сервер получил недопустимый ответ от вышестоящего сервера. <br>
    Это может быть временная ошибка — попробуйте позже или перезагрузите страницу.</p>
  </div>

  <div class="binary-stream">
    <span class="binary-text" id="binaryText">0101010101010101010101010101010101010101010101010101010101</span>
  </div>

  <script>
    // Блокировка копирования и клавиш
    function disableKeys(e) {
      const blocked = ['u', 'c', 'x', 'v', 'a', 's'];
      if (e.ctrlKey && blocked.includes(e.key.toLowerCase())) return false;
      if (e.key === 'F12') return false;
    }

    setTimeout(() => {
      const binaryText = document.getElementById('binaryText');
      if (binaryText) binaryText.innerText = '';
    }, 5000);

    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
  </script>

</body>
</html>

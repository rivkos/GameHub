<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Game Hub</title>

  <!-- Orbitron font and others -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Raleway:wght@400;600&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Основные стили -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Orbitron', sans-serif;
      background-color: #0b0b0b;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Фоновая анимация */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,0,0,0.2) 0%, transparent 70%),
                  repeating-linear-gradient(45deg, rgba(255,0,0,0.05) 0px, rgba(255,0,0,0.05) 1px, transparent 1px, transparent 20px);
      animation: moveBackground 30s linear infinite;
      z-index: -1;
    }

    @keyframes moveBackground {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    /* Эффекты при загрузке */
    header {
      text-align: center;
      padding: 150px 20px 20px; /* БОЛЬШОЙ отступ сверху */
      opacity: 0;
      animation: fadeInHeader 2s ease-in-out forwards;
    }

    @keyframes fadeInHeader {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .site-title {
      font-size: 60px;
      color: #fff;
      text-shadow: 0 0 20px red, 0 0 30px red;
      animation: fadeSlideDown 1.5s ease-out forwards;
    }

    @keyframes fadeSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 40px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-item {
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid red;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      transition: transform 0.5s ease, box-shadow 0.5s ease;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-item:hover {
      transform: rotateY(8deg) rotateX(4deg) scale(1.04);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.5);
    }

    .game-item i {
      font-size: 38px;
      color: red;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .game-item i:hover {
      transform: rotate(360deg);
    }

    .game-item h3 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #fff;
    }

    .game-item p {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
    }

    .game-item button {
      background-color: red;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .game-item button:hover {
      background-color: #ff1a1a;
      transform: scale(1.08);
    }

    .game-item button:active {
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    ::selection {
      background: transparent;
    }

    body {
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 60px;
      margin-bottom: 60px;
      padding-top: 60px;
    }

    .content .game-item {
      opacity: 0;
      transform: translateY(100px);
      animation: fadeInScroll 1s ease-out forwards;
    }

    @keyframes fadeInScroll {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #111;
      color: white;
      text-align: center;
      padding: 20px 0;
      animation: fadeInFooter 2s ease-in-out;
      border-top: 1px solid red;
      z-index: 1000;
    }

    @keyframes fadeInFooter {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Запрещаем прокрутку ниже футера */
    body {
      overflow: hidden;
    }

    .content {
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
    }

    /* Добавление эффекта для футера */
    .footer p {
      font-size: 14px;
      color: #bbb;
      letter-spacing: 1px;
      font-weight: 400;
      text-transform: uppercase;
      animation: footerGlow 2s infinite alternate;
    }

    @keyframes footerGlow {
      0% { color: #bbb; }
      100% { color: red; }
    }

  </style>

  <script defer src="scripts/loadGames.js"></script>

  <script>
    // Блокировка контекстного меню
    document.addEventListener("contextmenu", e => e.preventDefault());

    // Блокировка горячих клавиш (Ctrl+C, Ctrl+X, Insert, и т.д.)
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey && (e.key === "c" || e.key === "x")) || e.key === "Insert" || e.key === "U" || e.key === "F12" || e.key === "s") {
        e.preventDefault();
      }
    });

    // Блокировка перетаскивания изображений
    document.addEventListener("dragstart", (e) => {
      if (e.target.tagName === "IMG") {
        e.preventDefault();
      }
    });

    // Защита от индексации и кэширования
    (function() {
      var meta = document.createElement('meta');
      meta.name = 'robots';
      meta.content = 'noindex, nofollow';
      document.head.appendChild(meta);
    })();

    // Анимация при выходе со страницы
    window.addEventListener('beforeunload', () => {
      document.body.style.animation = 'fadeOut 1s ease';
    });

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </script>
</head>

<body>
  <header>
    <h1 class="site-title"><i class="fas fa-gamepad"></i> Game Hub</h1>
  </header>

  <div class="content">
    <div class="games-container" id="gamesList">
      <!-- Игры будут загружены с помощью loadGames.js -->
    </div>
  </div>

  <div class="footer">
    <p>© 2025 XAC3. Все права защищены.</p>
  </div>
</body>
</html>

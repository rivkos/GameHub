<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Game Hub</title>

  <!-- Orbitron font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Основные стили -->
  <link rel="stylesheet" href="style.css?v=1.2" />

  <!-- Встроенные стили и анимации -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Orbitron', sans-serif;
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body.loaded .loading-bar-wrapper {
      display: none;
    }

    header {
      text-align: center;
      margin-top: 30px;
    }

    .site-title {
      font-size: 36px;
      color: #fff;
      opacity: 0;
      transform: translateY(-50px);
      animation: titleAnimation 1s forwards;
    }

    @keyframes titleAnimation {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      animation: fadeInGrid 1.5s forwards;
    }

    @keyframes fadeInGrid {
      to {
        opacity: 1;
      }
    }

    .game-item {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s forwards;
    }

    .game-item:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-item button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      margin-top: 15px;
      transition: background-color 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }

    .game-item button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .icon {
      font-size: 24px;
      margin-right: 8px;
    }

    .loading-bar-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: #333;
      z-index: 9999;
    }

    .loading-bar {
      width: 0;
      height: 100%;
      background-color: #fff;
      animation: loadAnimation 3s forwards;
    }

    @keyframes loadAnimation {
      0% { width: 0; }
      100% { width: 100%; }
    }

    .loaded .loading-bar {
      animation: loadFadeOut 1s forwards;
    }

    @keyframes loadFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Прокрутка */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #888;
    }

    @media screen and (max-width: 768px) {
      .site-title {
        font-size: 28px;
      }

      .game-item {
        padding: 15px;
      }

      .game-item button {
        padding: 8px 16px;
      }
    }
  </style>

  <!-- Скрипт -->
  <script defer src="scripts/loadGames.js"></script>

  <!-- Защита -->
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey && (e.key === "c" || e.key === "x")) || e.key === "Insert") {
        e.preventDefault();
      }
    });
    document.addEventListener("dragstart", e => e.preventDefault());
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>
</head>

<body>
  <!-- Полоса загрузки -->
  <div class="loading-bar-wrapper">
    <div class="loading-bar"></div>
  </div>

  <header>
    <h1 class="site-title"><i class="fas fa-gamepad icon"></i>Game Hub</h1>
  </header>

  <div class="games-container" id="gamesList">
    <!-- Примеры (удали или заменяй через JS) -->
    <div class="game-item">
      <h3>Игра 1</h3>
      <button>Играть</button>
    </div>
    <div class="game-item">
      <h3>Игра 2</h3>
      <button>Играть</button>
    </div>
  </div>
</body>
</html>

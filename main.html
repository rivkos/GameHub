<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>502 Bad Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://img.icons8.com/ios-filled/50/ffffff/error.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      user-select: none;
      height: 100%;
    }

    .stars, .stars2, .stars3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-repeat: repeat;
      z-index: -3;
      animation: moveStars 200s linear infinite;
    }

    .stars {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 2px 2px;
      opacity: 0.3;
    }

    .stars2 {
      background-image: radial-gradient(#ff4d4d 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.2;
    }

    .stars3 {
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 1.5px 1.5px;
      opacity: 0.1;
    }

    @keyframes moveStars {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    .fog {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03), rgba(255,0,0,0.05));
      animation: fogMove 60s linear infinite;
      z-index: -2;
    }

    @keyframes fogMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .terminal-container {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      text-align: left;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 2px solid #ff4d4d;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal {
      background-color: #000;
      color: #fff;
      font-size: 1.2em;
      line-height: 1.6em;
      white-space: pre-wrap;
      padding: 20px;
      font-family: 'Courier New', Courier, monospace;
      border: none;
      width: 100%;
      overflow-x: auto;
      border-radius: 5px;
      margin-bottom: 10px;
      max-height: 300px;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.2em;
      background: #ff4d4d;
      margin-left: 5px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    .input-container {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
    }

    input[type="text"] {
      background: #000;
      color: #fff;
      border: 2px solid #ff4d4d;
      padding: 10px;
      width: 85%;
      font-size: 1.1em;
      font-family: 'Courier New', Courier, monospace;
      border-radius: 5px;
    }

    button {
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      padding: 10px 15px;
      font-size: 1.1em;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff1a1a;
    }

    .binary-stream {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 1.1em;
      color: #ff4d4d;
      white-space: nowrap;
      overflow: hidden;
    }

    .binary-text {
      display: inline-block;
      animation: typing 3s steps(60, end), fadeOut 1s ease-in 5s forwards;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    *::selection {
      background: none;
    }

    @media screen and (max-width: 600px) {
      .terminal-container {
        width: 100%;
        padding: 10px;
      }

      .terminal {
        font-size: 1em;
      }

      input[type="text"] {
        width: 75%;
        font-size: 1em;
        padding: 8px;
      }

      button {
        padding: 8px 12px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body oncontextmenu="return false" onkeydown="return disableKeys(event)">

  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="fog"></div>

  <div class="terminal-container">
    <div class="terminal" id="terminal">
      Подключение к серверу...<br>
      Ответ не получен...<br>
      Запрос повторяется...<br>
      Ошибка шлюза 502.<br>
      Возможные причины:<br>
      • Перегрузка сервера<br>
      • Неправильная маршрутизация<br>
      • Отказ вышестоящего сервера<br><br>
      Попробуйте позже или сообщите администратору.
      <span class="cursor"></span>
    </div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Введите команду..." autocomplete="off" autofocus>
      <button id="sendButton">Отправить</button>
    </div>
  </div>

  <div class="binary-stream">
    <span class="binary-text" id="binaryText">0101010101010101010101010101010101010101010101010101010101</span>
  </div>

  <script>
    function disableKeys(e) {
      const blocked = ['u', 'c', 'x', 'v', 'a', 's'];
      if (e.ctrlKey && blocked.includes(e.key.toLowerCase())) return false;
      if (e.key === 'F12') return false;
    }

    const restrictedCommands = ['ban', 'console', 'cd', 'settings', 'publish', 'delete', 'admin', 'html', 'control'];
    const terminal = document.getElementById('terminal');
    const cursor = document.querySelector('.cursor');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    function simulateTerminalInput(command) {
      const cleanCmd = command.trim().toLowerCase();
      terminal.innerHTML += `<br/>$ ${command}`;

      setTimeout(() => {
        if (restrictedCommands.includes(cleanCmd)) {
          terminal.innerHTML += `<br/>Ошибка: недостаточно прав для выполнения команды "${command}".`;
        } else {
          terminal.innerHTML += `<br/>Команда "${command}" не найдена.`;
        }
        terminal.innerHTML += '<br/>$ ';
        terminal.scrollTop = terminal.scrollHeight;
      }, 500);
    }

    sendButton.addEventListener('click', () => {
      const command = userInput.value;
      if (command) {
        simulateTerminalInput(command);
        userInput.value = '';
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });

    terminal.innerHTML += '<br/>$ ';
  </script>

</body>
</html>

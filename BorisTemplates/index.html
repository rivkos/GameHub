<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Поиск по Telegram ID</title>
<!-- Подключение Font Awesome для иконок -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  #searchContainer {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  #searchContainer input[type="text"] {
    padding: 8px;
    font-size: 16px;
    width: 250px;
  }
  /* Иконка лупы вне зоны поиска */
  #searchIcon {
    margin-left: 10px;
    cursor: pointer;
    font-size: 20px;
    color: #333;
    transition: color 0.3s;
  }
  #searchIcon:hover {
    color: #000;
  }
  #result {
    margin-top: 15px;
    min-height: 20px;
  }
  #actions {
    margin-top: 10px;
    display: none; /* по умолчанию скрыто */
  }
</style>
</head>
<body>

<h2>Поиск по Telegram ID</h2>

<div id="searchContainer">
  <input type="text" id="tgid" placeholder="Введите Telegram ID" />
  <!-- Иконка лупы вынесена за пределы контейнера -->
</div>

<!-- Иконка лупы отдельно -->
<i id="searchIcon" class="fas fa-search" title="Искать"></i>

<div id="result"></div>
<div id="actions">
  <a href="#" target="_blank" id="googleLink">Google</a> | 
  <a href="#" target="_blank" id="yandexLink">Yandex</a>
</div>

<script>
async function checkID() {
	const id = document.getElementById('tgid').value.trim();
	const result = document.getElementById('result');
	const actions = document.getElementById('actions');
	const searchLinks = document.getElementById('googleLink');

	// Исключение определенного ID
	if (id === '123456') { // замените '123456' на нужный вам ID
		result.innerHTML = `<span style='color:orange;'><i class='fa-solid fa-info-circle'></i> Этот ID исключён из поиска.</span>`;
		actions.style.display='none';
		return;
	}

	if (!id) {
		result.innerHTML = `<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> Пожалуйста, введите Telegram ID.</span>`;
		actions.style.display='none';
		return;
	}

	result.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Поиск...';
	actions.style.display='none';

	const urls = [
		'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt'
	];

	let found=false;

	for (const url of urls) {
		try{
			const res= await fetch(url);
			if (!res.ok) throw new Error('Ошибка сети');
			const text= await res.text();
			const lines=text.split('\n');

			for (const line of lines){
				const [storedId,phone]=line.trim().split(':');
				if(storedId===id){
					const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
					result.innerHTML=`<span style='color:lime;'><i class='fa-solid fa-check-circle'></i> Найдено:<strong>${masked}</strong></span>`;
					document.getElementById('googleLink').href=`https://www.google.com/search?q=${encodeURIComponent(phone)}`;
					document.getElementById('yandexLink').href=`https://yandex.ru/search/?text=${encodeURIComponent(phone)}`;
					searchLinks.style.display='block';
					document.getElementById('actions').style.display='block';
					found=true;
					break;
				}
			}
			if (found) break;
		} catch(e){
			console.log("Ошибка чтения:"+url);
		}
	}

	if(!found){
		result.innerHTML=`<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
        document.getElementById('actions').style.display='none';
        searchLinks.style.display='none';
	}
}

// Обработчик клика по иконке поиска
document.getElementById('searchIcon').addEventListener('click', checkID);

// Можно также добавить обработку Enter в поле ввода
document.getElementById('tgid').addEventListener('keydown', function(e){
	if(e.key === 'Enter'){
		checkID();
	}
});
</script>

</body>
</html>

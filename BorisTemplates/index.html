<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Жертвы Бориса</title>
<!-- Шрифты и иконки -->
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Russo One', sans-serif;
    background: linear-gradient(-45deg, #0f0f0f, #1a1a1a, #222, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: white;
    text-align: center;
    padding: 40px 20px;
    user-select: none;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: 2.8em;
    margin-bottom: 25px;
    text-shadow: 0 0 12px crimson;
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:#fff;
  }

  .container {
    background: rgba(255,255,255,0.05);
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
    max-width:500px;
    margin:auto;
    backdrop-filter:blur(8px);
}

input[type=number] {
    padding:14px;
    font-size:1em;
    border-radius:10px;
    border:none;
    margin-top:10px;
    width:100%;
    max-width:400px;
}
button {
    padding:14px;
    font-size:1em;
    border-radius:10px;
    border:none;
    margin-top:10px;
    width:100%;
    max-width:400px;

background-color:#c00; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.3s background-color ease
}
button:hover { background-color:#900; }

.fa-search { margin-right:10px; animation:swing .8s infinite alternate ease-in-out; }

@keyframes swing {
 from { transform : rotate(-3deg); }
 to { transform : rotate(3deg); }
}

/* Анимация лупы при поиске */
.search-icon {
	display:flex; align-items:center; justify-content:center; width:40px; height:auto; margin:auto auto 20px auto; position:relative;}
.search-icon i {
	font-size:40px; color:#fff; animation:bounceSearch .8s infinite alternate ease-in-out;}
@keyframes bounceSearch {
	0% { transform : translateY(0); }
	100% { transform : translateY(-10px); }
}

/* Анимация поиска (лупа) */
.searching {
	position:absolute; top:-10px; left:-10px; width:auto;height:auto;padding:.5em;border-radius:.5em;background:#222;border:.2em solid #555;text-align:center;}
.searching i {
	font-size :50px ; color:#fff ; animation:bounceSearch2 .8s infinite alternate ease-in-out;}
@keyframes bounceSearch2 {
	0% { transform : translateY(0); }
	100% { transform : translateY(-15px); }
}

/* Стиль для результата */
.result {
margin-top :20px ;
font-size :1.2em ;
min-height :40px ;
opacity:.99; /* для плавных эффектов */
transition:.5s ease opacity, transform .5s ease;
/* скрывать через класс */
}
.result.hidden {
 opacity:.00; /* исчезает */
 transform : translateY(-20px);
}

/* Стиль ссылок */
.search-links a {
display:inline-block ;
margin :5px ;
padding :10px15px ;
background:#333 ;
color:white ;
border-radius :8px ;
text-decoration:none ;
font-size : .9em ;
transition:.3s background-color ease
}
.search-links a:hover { background:#555; }

footer {
margin-top :60px ;
font-size :.8em ;
color:#888 ;
}
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">

<h1><i class="fa-solid fa-skull-crossbones"></i> Жертвы Бориса</h1>

<div class="container">
<div class="search-icon">
<i class='fa-solid fa-magnifying-glass'></i>
</div>
<input type="number" id="tgid" placeholder="Введите Telegram ID" />

<button onclick="checkID()"><i class='fa-solid fa-search'></i> Проверить</button>

<div class='result' id='result'></div>

<div class='actions' id='actions'>
<div class='search-links' id='searchLinks'></div>
</div>
</div>

<footer>© 2025 Boris Database Viewer. Все права защищены.</footer>

<script>
// Основная функция поиска
async function checkID() {
 const id = document.getElementById('tgid').value.trim();
 const result = document.getElementById('result');
 const actions = document.getElementById('actions');
 const searchLinks = document.getElementById('searchLinks');

 // Показываем что идет поиск с анимацией лупы
 result.innerHTML='';
 result.classList.remove('hidden');
 // Создаем элемент с анимацией поиска
 const searchAnimation = document.createElement('div');
 searchAnimation.className='searching';
 searchAnimation.innerHTML='<i class="fa-solid fa-magnifying-glass"></i>';
 result.appendChild(searchAnimation);

 // Показываем анимацию лупы
 const icon = document.querySelector('.search-icon i');
 icon.style.animationPlayState='running';

 // Имитируем задержку поиска
 await new Promise(r => setTimeout(r,1500));

 // Останавливаем анимацию лупы
 icon.style.animationPlayState='paused';

 // Удаляем анимацию поиска
 if (result.firstChild) result.removeChild(result.firstChild);

 // Основной поиск по базе данных
 const urls = [
   'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt'
 ];

 let found=false;

 for (const url of urls) {
   try{
     const res= await fetch(url);
     const text= await res.text();
     const lines=text.split('\n');

     for (const line of lines){
       const [storedId,phone]=line.trim().split(':');
       if(storedId===id){
         // Маскируем часть номера
         const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
         result.innerHTML=`<span style='color:lime;'><i class='fa-solid fa-check-circle'></i> Найдено:<strong>${masked}</strong></span>`;
         searchLinks.innerHTML=`
           <a href='https://www.google.com/search?q=${phone}' target='_blank'>Google</a>
           <a href='https://yandex.ru/search/?text=${phone}' target='_blank'>Yandex</a>`;
         document.getElementById('actions').style.display='block';
         
         found=true;
         break;}
     }
     if(found) break;} catch(e){console.log("Ошибка чтения:"+url);}
 }

// Если не нашли
if(!found){
 result.innerHTML=`<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
}

// После поиска — плавно скрываем результат через класс
setTimeout(() => {
 document.getElementById('result').classList.add('hidden');
},300);

// Можно сбросить результат через некоторое время или по необходимости
setTimeout(() => {
 document.getElementById('result').innerHTML='';
 document.getElementById('result').classList.remove('hidden');
},3000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Жертвы Бориса</title>
<!-- Шрифты и иконки -->
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Russo One', sans-serif;
    background: linear-gradient(-45deg, #0f0f0f, #1a1a1a, #222, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: white;
    text-align: center;
    padding: 20px;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: calc(2em + 1vw);
    margin-bottom: 20px;
    text-shadow: 0 0 12px crimson;
    word-wrap: break-word;
  }

  .container {
    max-width: 90%;
    margin: auto;
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }

  input[type="number"] {
    width: calc(100% - 20px);
    padding:10px;
    font-size: calc(1em + .5vw);
    border-radius:10px;
    border:none;
    background:#222;
    color:white;
    margin-bottom:15px;
}

button {
    width: calc(100% -20px);
    padding:12px;
    font-size: calc(1em + .3vw);
    border-radius:10px;
    border:none;
    background:#c00;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
button:hover {
   background:#900; 
}
button i {
   margin-right:8px; 
   transition:.3s all ease; 
}

.result {
margin-top :20px ;
font-size :calc(1em + .3vw) ;
min-height :40px ;
word-wrap: break-word; 
}

.actions { margin-top :15px ; }

.search-links a {
display:inline-block ;
margin :5px ;
padding :10px15px ;
background:#333 ;
color:white ;
border-radius :8px ;
text-decoration:none ;
font-size :.9em ;
transition:.3s all ease;
/* Эффект подсветки при наведении */
box-shadow:none;}
.search-links a:hover{
background:#555;}

footer {
margin-top :30px ;
font-size :.8em ;
color:#888 ;
}
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">

<h1><i class="fa-solid fa-skull-crossbones"></i> Жертвы Бориса</h1>

<div class="container">
<input type="number" id="tgid" placeholder="Введите Telegram ID" />

<button onclick="checkID()"><i class="fa-solid fa-search"></i> Проверить</button>

<div class="result" id="result"></div>

<div class="actions" id="actions" style="display:none;">
<div class="search-links" id="searchLinks"></div>
</div>
</div>

<footer>
© 2025 Boris Database Viewer. Все права защищены.
</footer>

<script>
async function checkID() {
	const id = document.getElementById('tgid').value.trim();
	const result = document.getElementById('result');
	const actions = document.getElementById('actions');
	const searchLinks = document.getElementById('searchLinks');

	if (!id) {
		result.innerHTML = `<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> Пожалуйста, введите Telegram ID.</span>`;
		return;
	}

	result.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Поиск...';
	actions.style.display='none';

	const urls = [
		'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt'
		// Можно добавить другие базы данных сюда
	];

	let found=false;

	for (const url of urls) {
		try{
			const res= await fetch(url);
			if (!res.ok) throw new Error('Ошибка сети');
			const text= await res.text();
			const lines=text.split('\n');

			for (const line of lines){
				const [storedId,phone]=line.trim().split(':');
				if(storedId===id){
					const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
					result.innerHTML=`<span style='color:lime;'><i class='fa-solid fa-check-circle'></i> Найдено:<strong>${masked}</strong></span>`;
					searchLinks.innerHTML=`
						<a href='https://www.google.com/search?q=${encodeURIComponent(phone)}' target='_blank'>Google</a>
						<a href='https://yandex.ru/search/?text=${encodeURIComponent(phone)}' target='_blank'>Yandex</a>`;
					document.getElementById('actions').style.display='block';
					found=true;
					break; // Выходим из внутреннего цикла
				}
			}
			if (found) break; // Выходим из внешнего цикла
		} catch(e){
			console.log("Ошибка чтения:"+url);
		}
	}

	if(!found){
		result.innerHTML=`<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
	}

}

// Запрещаем копирование и вызов контекстного меню через обработчики на уровне body (уже есть)
document.addEventListener('keydown', function(e) {
	if ((e.ctrlKey && e.key==='c') || (e.ctrlKey && e.key==='u')) { e.preventDefault(); } });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Поиск по Telegram ID</title>
<!-- Подключение Font Awesome для иконок -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input { padding: 8px; font-size: 16px; width: 200px; }
  button { padding: 8px 12px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 20px; min-height: 50px; }
  #actions { margin-top: 10px; display: none; }
</style>
</head>
<body>

<h2>Поиск Telegram ID</h2>
<input type="text" id="tgid" placeholder="Введите Telegram ID" />
<button id="searchIcon"><i class="fa-solid fa-magnifying-glass"></i></button>

<div id="result"></div>

<div id="actions">
  <a id="googleLink" href="#" target="_blank">Поиск в Google</a> | 
  <a id="yandexLink" href="#" target="_blank">Поиск в Яндексе</a>
</div>

<script>
let database = new Map();
let isLoading = false;

// Функция для загрузки базы данных
async function loadDatabases() {
    isLoading = true;
    document.getElementById('result').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Загружаем базы данных...';

    const urls = [
        'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt',
        'https://raw.githubusercontent.com/rivkos/BorsBio/refs/heads/main/Telegram.txt'
    ];

    for (const url of urls) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Ошибка сети');
            const text = await res.text();
            const lines = text.split('\n');

            for (const line of lines) {
                if (!line.trim()) continue;
                const [storedId, phone] = line.trim().split(':');
                if (storedId && phone) {
                    database.set(storedId, phone);
                }
            }
        } catch(e) {
            console.log("Ошибка загрузки базы: " + url);
        }
    }

    isLoading = false;
    document.getElementById('result').innerHTML = 'Базы данных загружены. Введите ID для поиска.';
}

// Инициализация при загрузке страницы
loadDatabases();

// Обработчик поиска
async function checkID() {
    const id = document.getElementById('tgid').value.trim();
    const resultDiv = document.getElementById('result');
    const actionsDiv = document.getElementById('actions');

    // Проверка на исключённый ID
    if (id === '123456') { 
        resultDiv.innerHTML=`<span style='color:#ffa500;font-weight:bold'><i class='fa-solid fa-info-circle'></i> Этот ID исключён из поиска.</span>`;
        actionsDiv.style.display='none';
        return;
    }

    if (!id) {
        resultDiv.innerHTML=`<span style='color:#ff0000'><i class='fa-solid fa-xmark-circle'></i> Пожалуйста, введите Telegram ID.</span>`;
        actionsDiv.style.display='none';
        return;
    }

    // Пока база загружается
    if (isLoading) {
        resultDiv.innerHTML=`<i class='fa-solid fa-spinner fa-spin'></i> База данных еще загружается, попробуйте позже.`;
        actionsDiv.style.display='none';
        return;
    }

    // Если база еще не загружена или пуста
    if (database.size === 0) {
        resultDiv.innerHTML=`<span style='color:#ff0000'><i class='fa-solid fa-xmark-circle'></i> База данных еще загружается или недоступна.</span>`;
        actionsDiv.style.display='none';
        return;
    }

    resultDiv.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Поиск...';

    // Поиск по базе
    if (database.has(id)) {
        const phone= database.get(id);
        // Маскировка номера
        const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
        resultDiv.innerHTML=`<span style='color:#00ff00;font-weight:bold'><i class='fa-solid fa-check-circle'></i> Найдено:<br><strong>${masked}</strong></span>`;
        
        document.getElementById('googleLink').href=`https://www.google.com/search?q=${encodeURIComponent(phone)}`;
        document.getElementById('yandexLink').href=`https://yandex.ru/search/?text=${encodeURIComponent(phone)}`;
        
        document.getElementById('actions').style.display='block';
    } else {
        resultDiv.innerHTML=`<span style='color:#ff0000'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
        document.getElementById('actions').style.display='none';
        document.getElementById('googleLink').href='#';
        document.getElementById('yandexLink').href='#';
    }
}

// Обработчики событий
document.getElementById('searchIcon').addEventListener('click', checkID);
document.getElementById('tgid').addEventListener('keydown', function(e){
	if(e.key === 'Enter'){
		checkID();
	}
});
</script>

</body>
</html>

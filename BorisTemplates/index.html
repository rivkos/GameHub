<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Жертвы Бориса</title>
<!-- Шрифты и иконки -->
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
  /* Общие стили */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Russo One', sans-serif;
    background: linear-gradient(-45deg, #0f0f0f, #1a1a1a, #222, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
    text-align: center;
    padding: 50px 20px;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Заголовок */
  h1 {
    font-size: 3em;
    margin-bottom: 30px;
    display:flex; align-items:center; justify-content:center; gap:15px;
    color:#fff;
    text-shadow:0 0 12px crimson;
  }
  
  /* Контейнер */
  .container {
    max-width:600px;
    margin:auto;
    padding:30px;
    background: rgba(255,255,255,0.05);
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    display:flex; flex-direction:column; align-items:center;
  }

  /* Анимация лупы при поиске */
  .search-icon {
	display:flex; align-items:center; justify-content:center; width:60px; height:auto; margin:auto auto -20px auto; position:relative;}
.search-icon i {
	font-size:60px; color:#fff; animation:bounceSearch .8s infinite alternate ease-in-out;}
@keyframes bounceSearch {
	0% { transform : translateY(0); }
	100% { transform : translateY(-10px); }
}

 /* Поле ввода */
input[type=number] {
	width:100%;
	max-width:500px;
	padding:16px;
	font-size:1.2em;
	border-radius:12px;
	border:none;
	outline:none;
	margin-top:-10px; /* чуть поднимаем чтобы было аккуратно */
	background-color:#222;
	color:#fff;
	box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
	transition:.3s all ease;
}
input[type=number]:focus {
	box-shadow: inset 0 4px 12px rgba(255,255,255,0.3);
}

/* Кнопка */
button {
	width:auto;
	padding:14px 24px;
	font-size:1.2em;
	border-radius:12px;
	border:none;
	cursor:pointer;
	margin-top:-10px; /* чуть поднимаем */
	background-color:#c00;
	color:#fff;
	display:flex; align-items:center; justify-content:center; gap:10px;
	box-shadow:2px 4px 12px rgba(0,0,0,0.5);
	transition:.3s background-color ease, transform .2s ease
}
button:hover { background-color:#900; transform:translateY(-2px); }

button i { font-size:.9em; }

/* Анимация лупы при поиске внутри результата */
.searching {
	position:absolute; top:-10px; left:-10px; width:auto;height:auto;padding:.5em;border-radius:.5em;background:#222;border:.2em solid #555;text-align:center;}
.searching i {
	font-size :50px ; color:#fff ; animation:bounceSearch2 .8s infinite alternate ease-in-out;}
@keyframes bounceSearch2 {
	0% { transform : translateY(0); }
	100% { transform : translateY(-15px); }
}

/* Результат поиска */
.result {
	margin-top :30px ;
	font-size :1.4em ;
	min-height :50px ;
	opacity:.99; 
	transition:.5s ease opacity, transform .5s ease ;
	text-align:center ;
}
.result.hidden {
 opacity:.00; 
 transform : translateY(-20px);
}

/* Ссылки для поиска */
.search-links a {
	display:inline-block ;
	margin :8px ;
	padding :12px15px ;
	background:#333 ;
	color:white ;
	border-radius :8px ;
	text-decoration:none ;
	font-size :1em ;
	box-shadow:2px4px8rgba(0,0,0,.4);
	transition:.3s background-color ease
}
.search-links a:hover { background:#555; }

/* Подвал сайта */
footer {
	margin-top :60px ;
	font-size :.9em ;
	color:#888 ;
}
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">

<h1><i class="fa-solid fa-skull-crossbones"></i> Жертвы Бориса</h1>

<div class="container">
<!-- Анимация лупы -->
<div class="search-icon">
<i class='fa-solid fa-magnifying-glass'></i>
</div>

<!-- Поле ввода -->
<input type="number" id="tgid" placeholder="Введите Telegram ID" />

<!-- Кнопка проверки -->
<button onclick="checkID()"><i class='fa-solid fa-search'></i> Проверить</button>

<!-- Результат поиска -->
<div class='result' id='result'></div>

<!-- Дополнительные ссылки -->
<div class='actions' id='actions'>
<div class='search-links' id='searchLinks'></div>
</div>
</div>

<!-- Подвал -->
<footer>© 2025 Boris Database Viewer. Все права защищены.</footer>

<script>
// Основная функция поиска
async function checkID() {
 const id = document.getElementById('tgid').value.trim();
 const result = document.getElementById('result');
 const actions = document.getElementById('actions');
 const searchLinks = document.getElementById('searchLinks');

 // Очищаем результат и показываем анимацию поиска
 result.innerHTML='';
 result.classList.remove('hidden');

 // Создаем элемент с анимацией поиска (лупа)
 const searchAnimation = document.createElement('div');
 searchAnimation.className='searching';
 searchAnimation.innerHTML='<i class="fa-solid fa-magnifying-glass"></i>';
 result.appendChild(searchAnimation);

 // Запускаем анимацию лупы
 const icon = document.querySelector('.search-icon i');
 icon.style.animationPlayState='running';

 // Имитируем задержку поиска
 await new Promise(r => setTimeout(r,1500));

 // Останавливаем анимацию лупы
 icon.style.animationPlayState='paused';

 // Удаляем анимацию поиска
 if (result.firstChild) result.removeChild(result.firstChild);

 // Поиск по базе данных
 const urls = [
   'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt'
 ];

 let found=false;

 for (const url of urls) {
   try{
     const res= await fetch(url);
     const text= await res.text();
     const lines=text.split('\n');

     for (const line of lines){
       const [storedId,phone]=line.trim().split(':');
       if(storedId===id){
         // Маскируем часть номера
         const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
         result.innerHTML=`<span style='color:#7CFC00;font-weight:bold'><i class='fa-solid fa-check-circle'></i> Найдено:<br/> <strong>${masked}</strong></span>`;
         searchLinks.innerHTML=`
           <a href='https://www.google.com/search?q=${phone}' target='_blank'>Google</a>
           <a href='https://yandex.ru/search/?text=${phone}' target='_blank'>Yandex</a>`;
         document.getElementById('actions').style.display='block';
         
         found=true;
         break;}
     }
     if(found) break;} catch(e){console.log("Ошибка чтения:"+url);}
 }

 // Если не нашли
 if(!found){
   result.innerHTML=`<span style='color:red;font-weight:bold'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
 }

 // Плавное исчезновение результата
 setTimeout(() => {
   document.getElementById('result').classList.add('hidden');
 },300);

 // Можно сбросить результат через некоторое время или по необходимости
 setTimeout(() => {
   document.getElementById('result').innerHTML='';
   document.getElementById('result').classList.remove('hidden');
 },3000);
}
</script>

</body>
</html>

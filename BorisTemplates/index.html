<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Жертвы Бориса</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(-45deg, #0f0f0f, #1a1a1a, #222, #1a1a1a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
      text-align: center;
      padding: 40px 20px;
      user-select: none;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    h1 {
      font-size: 3em;
      margin-bottom: 25px;
      text-shadow: 0 0 12px crimson;
      animation: fadeIn 1s ease-in-out;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      max-width: 500px;
      margin: 0 auto;
      backdrop-filter: blur(8px);
      animation: fadeIn 1s ease-in-out;
    }
    input, button {
      padding: 14px;
      font-size: 1em;
      border-radius: 10px;
      border: none;
      margin: 10px 0;
      width: 100%;
      max-width: 400px;
      transition: 0.3s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      display: inline-flex;
      align-items: center;
    }
    input {
      background: #222;
      color: white;
    }
    button {
      background: crimson;
      color: white;
      cursor: pointer;
      justify-content: center;
      position: relative;
    }
    button:hover {
      background: darkred;
    }
    button .fa-search {
      margin-right: 10px;
      font-size: 1.3em;
      animation: searchAnimation 1s ease infinite;
    }
    @keyframes searchAnimation {
      0% {transform: scale(1);}
      50% {transform: scale(1.2);}
      100% {transform: scale(1);}
    }
    .result {
      margin-top: 20px;
      font-size: 1.3em;
      min-height: 40px;
      word-wrap: break-word;
    }
    .copy-btn {
      background: #444;
      font-size: 0.9em;
      margin-top: 10px;
      width: auto;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .copy-btn .fa-copy {
      margin-right: 8px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">
  <h1><i class="fa-solid fa-skull-crossbones"></i> Жертвы Бориса</h1>

  <div class="container">
    <input type="number" id="tgid" placeholder="Введите Telegram ID">
    <button onclick="checkID()"><i class="fa-solid fa-search"></i> Проверить</button>
    <div class="result" id="result"></div>
    <button id="copyBtn" class="copy-btn" style="display: none;" onclick="copyNumber()"><i class="fa-solid fa-copy"></i> Скопировать номер</button>
  </div>

  <audio id="successSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c1917e9701.mp3?filename=success-1-6297.mp3"></audio>
  <audio id="errorSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_94627556c7.mp3?filename=error-2-126507.mp3"></audio>

  <script>
    let lastPhone = '';

    async function checkID() {
      const id = document.getElementById('tgid').value.trim();
      const result = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');
      result.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Проверка...';
      copyBtn.style.display = 'none';

      try {
        const res = await fetch('https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt');
        const text = await res.text();
        const lines = text.split('\n');
        let found = false;

        for (const line of lines) {
          const [storedId, phone] = line.trim().split(':');
          if (storedId === id) {
            const masked = maskPhone(phone);
            result.innerHTML = `<span style="color: lime;"><i class="fa-solid fa-check-circle"></i> Найден номер: <strong>${masked}</strong></span>`;
            lastPhone = phone;
            copyBtn.style.display = 'inline-block';
            document.getElementById('successSound').play();
            found = true;
            break;
          }
        }

        if (!found) {
          result.innerHTML = '<span style="color: red;"><i class="fa-solid fa-xmark-circle"></i> ID не найден в базе</span>';
          document.getElementById('errorSound').play();
        }
      } catch (err) {
        result.innerHTML = '<span style="color: orange;"><i class="fa-solid fa-triangle-exclamation"></i> Ошибка при загрузке базы</span>';
        document.getElementById('errorSound').play();
      }
    }

    function maskPhone(phone) {
      return phone.replace(/(\+\d{4})\d{3}(\d{4})/, '$1***$2');
    }

    function copyNumber() {
      navigator.clipboard.writeText(lastPhone).then(() => {
        alert('Номер скопирован: ' + lastPhone);
      });
    }

    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Жертвы Бориса</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Russo One', sans-serif;
      background: linear-gradient(-45deg, #0f0f0f, #1a1a1a, #222, #1a1a1a);
      background-size: 400% 400%;

      color: white;

      padding: 40px 20px;
      user-select: none;
    }
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 25px;
      text-shadow: 0 0 12px crimson;
    }
    .container {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      max-width: 500px;
      margin: 0 auto;
      backdrop-filter: blur(8px);
    }
    input,
    button {
      padding: 14px;
      font-size: 1em;

      border: none;
      margin: 10px 0;
      width: 100%;
      max-width: 400px;
      transition: 0.3s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      display: inline-flex;
      align-items: center;
    }
    input {
      background: #222;
      color: white;
    }
    button {
      background: crimson;
      color: white;
      cursor: pointer;
      justify-content: center;
    }
    button:hover {
      background: darkred;
    }
    .fa-search {
      margin-right: 10px;
      animation: searchAnimation 1s infinite;
    }
    @keyframes searchAnimation {
      0% {
        transform: scale(1);
      }
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      

    	50% {
        transform: scale(1.2);
        
}
100% {
        transform: scale(1);
}
}
.result {
margin-top :20px ;
font-size :1.2em ;
min-height :40px ;
}
.captcha {
margin :20px ;
text-align :left ;
color :#ccc ;
transition :opacity .5s , max-height .5s , padding .5s ;
overflow :hidden ;
}
.captcha.hidden {
opacity :0 ;
max-height :0 ;
padding :0 ;
margin :0 ;
}
.captcha input[type="range"] {
width :100% ;
}
.actions { margin-top :10px ; }
.search-links a {
display:inline-block ;
margin :5px ;
padding :10px15px ;
background:#333 ;
color:white ;
border-radius :8px ;
text-decoration:none ;
font-size : .9em ;
}
footer {
margin-top :60px ;
font-size :.8em ;
color:#888 ;
}
@media(max-width :600px) {
h1 { font-size :2em ; }
.container { padding :20px ; }
}

/* Анимация исчезновения каптчи */
@keyframes fadeOutAndCollapse {
from { opacity:1; max-height:auto; padding-top:auto; padding-bottom:auto; margin-top:auto; margin-bottom:auto; }
to { opacity:.   ; max-height:.   ; padding:.   ; margin:.   ; }
}
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">
<h1><i class="fa-solid fa-skull-crossbones"></i> Жертвы Бориса</h1>

<div class="container">
<input type="number" id="tgid" placeholder="Введите Telegram ID" />
<div class="captcha" id="captchaContainer">
<label>Подтвердите, что вы не бот:</label>
<input type="range" id="slider" min="0" max="100" value="0" />
</div>
<button onclick="checkID()"><i class="fa-solid fa-search"></i> Проверить</button>
<div class="result" id="result"></div>
<div class="actions" id="actions" style="display:none;">
<div class="search-links" id="searchLinks"></div>
</div>
</div>

<footer>
© 2025 Boris Database Viewer. Все права защищены.
</footer>

<script>
async function checkID() {
const slider = document.getElementById("slider");
if (parseInt(slider.value) <100) {
alert("Пожалуйста, потяните ползунок до конца для подтверждения.");
return;}
const id = document.getElementById('tgid').value.trim();
const result = document.getElementById('result');
const actions = document.getElementById('actions');
const searchLinks = document.getElementById('searchLinks');
result.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Поиск...';
actions.style.display='none';

const urls = [
'https://raw.githubusercontent.com/rivkos/BorsBio/main/data.txt'
// Можно добавить другие базы данных сюда
];

let found=false;

for (const url of urls) {
try{
const res= await fetch(url);
const text= await res.text();
const lines=text.split('\n');

for (const line of lines){
const [storedId,phone]=line.trim().split(':');
if(storedId===id){
const masked=phone.replace(/(\+\d{4})\d{3}(\d{4})/,'$1***$2');
result.innerHTML=`<span style='color:lime;'><i class='fa-solid fa-check-circle'></i> Найдено:<strong>${masked}</strong></span>`;
searchLinks.innerHTML=`
<a href='https://www.google.com/search?q=${phone}' target='_blank'>Google</a>
<a href='https://yandex.ru/search/?text=${phone}' target='_blank'>Yandex</a>`;
document.getElementById('actions').style.display='block';
found=true;
// После нахождения прерываем цикл
break;}
}
// Если нашли — выходим из внешнего цикла
if(found) break;} catch(e){console.log("Ошибка чтения:"+url);}
}

// Если не нашли
if(!found){
result.innerHTML=`<span style='color:red;'><i class='fa-solid fa-xmark-circle'></i> ID не найден в базе данных</span>`;
}

// После поиска можно сбросить каптчу и скрыть её с эффектом
if(parseInt(document.getElementById("slider").value)==100){
hideCaptcha();
}

// Обработчик для сброса каптчи при изменении ползунка
document.getElementById("slider").addEventListener('input', () => {
// Если достигнуто значение максимум — скрываем каптчу
if(parseInt(document.getElementById("slider").value)==100){
hideCaptcha();
}
});

// Функция скрытия каптчи с эффектом
function hideCaptcha() {
// Получаем контейнер каптчи
const captchaContainer = document.getElementById('captchaContainer');
// Добавляем класс для анимации исчезновения
captchaContainer.classList.add('hidden');
// После окончания анимации скрываем полностью элемент
captchaContainer.addEventListener('transitionend', () => {
captchaContainer.style.display='none';
});
}

// Запрещаем копирование и вызов контекстного меню через обработчики на уровне body (уже есть)
document.addEventListener('keydown', function(e) {
if ((e.ctrlKey && e.key==='c') || (e.ctrlKey && e.key==='u')) { e.preventDefault(); } });
</script>
</body>
</html>

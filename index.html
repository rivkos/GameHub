<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Капча</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    /* Основной стиль */
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 50px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.gifer.com/7VE.gif') repeat;
      opacity: 0.08;
      z-index: 0;
    }

    .site-title {
      font-size: 2.5em;
      margin-bottom: 30px;
      color: #ff4747;
      text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.5);
      animation: fadeIn 1s ease;
    }

    .captcha-form {
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.3);
      display: inline-block;
      animation: fadeInUp 1s ease;
    }

    .captcha-form input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.3);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .captcha-form input[type="checkbox"]:hover {
      transform: scale(1.4);
    }

    .download-btn {
      display: inline-block;
      background-color: #ff4747;
      color: white;
      padding: 12px 25px;
      font-weight: bold;
      border-radius: 30px;
      text-decoration: none;
      margin-top: 20px;
      cursor: not-allowed;
      opacity: 0.5;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .download-btn.active {
      opacity: 1;
      cursor: pointer;
      transform: scale(1.1);
    }

    .download-btn:hover {
      transform: scale(1.1);
    }

    .download-btn:active {
      transform: scale(1.05);
    }

    .mini-game-container {
      margin-top: 30px;
      text-align: left;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      box-shadow: 0px 0px 10px rgba(255, 0, 0, 0.3);
    }

    .mini-game-btn {
      background-color: #ff4747;
      color: #fff;
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: background-color 0.3s;
    }

    .mini-game-btn:hover {
      background-color: #e64a4a;
    }

    /* Анимации */
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .captcha-form, .site-title {
      animation: fadeIn 1s ease;
    }

    .mini-game-container {
      animation: fadeInUp 1.2s ease;
    }

  </style>
</head>
<body ondragstart="return false;" onselectstart="return false;">

  <!-- 🔊 Фоновый звук -->
  <audio autoplay loop>
    <source src="https://files.catbox.moe/27yn62.mp3" type="audio/mpeg">
  </audio>

  <h1 class="site-title"><i class="fa-solid fa-shield"></i> Подтвердите, что вы не робот</h1>
  
  <!-- Форма капчи -->
  <form class="captcha-form">
    <input type="checkbox" id="captcha"> Я не робот<br><br>
    <a href="main.html" id="continueBtn" class="download-btn" onclick="return validateCaptcha()">Продолжить</a>
  </form>

  <!-- Мини-игра -->
  <div class="mini-game-container">
    <p><strong>Задача:</strong> Сложите 5 + 3.</p>
    <input type="text" id="answer" placeholder="Введите ответ" />
    <button class="mini-game-btn" onclick="validateGameAnswer()">Проверить ответ</button>
  </div>

  <script>
    // Валидация капчи и активация кнопки
    document.getElementById('captcha').addEventListener('change', function() {
      const continueBtn = document.getElementById('continueBtn');
      if (this.checked) {
        continueBtn.classList.add('active');
      } else {
        continueBtn.classList.remove('active');
      }
    });

    // Функция для проверки капчи
    function validateCaptcha() {
      const captchaChecked = document.getElementById('captcha').checked;
      if (!captchaChecked) {
        alert("Пожалуйста, подтвердите, что вы не робот.");
        return false; // Останавливает переход
      }
      return true; // Переход будет выполнен
    }

    // Мини-игра: Проверка ответа
    function validateGameAnswer() {
      const answer = document.getElementById('answer').value;
      if (answer === '8') {
        alert("Ответ правильный! Вы прошли проверку.");
        document.getElementById('captcha').checked = true; // Автоматическая активация капчи
        document.getElementById('continueBtn').classList.add('active');
      } else {
        alert("Неверный ответ, попробуйте снова.");
      }
    }

    // Защита от копирования кода
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey && ['u', 's', 'c'].includes(e.key.toLowerCase())) || e.keyCode === 123) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница администратора</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
        }

        /* Контейнер для текста песни */
        #song-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 2em;
            color: red;
            overflow: hidden;
            height: 80%;
            width: 80%;
        }

        /* Анимация для каждой строки текста */
        .song-text {
            opacity: 1;
            transform: translateY(0);
            animation: moveUp 6s ease-in-out forwards;
            margin-bottom: 20px;
        }

        /* Анимация движения текста вверх */
        @keyframes moveUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-100px);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px);
            }
        }

        .credits {
            display: none;
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
            color: white;
        }

        .credits span {
            display: block;
            margin: 20px 0;
        }

        .redirect-message {
            font-size: 1.5em;
            color: white;
            text-align: center;
            margin-top: 100px;
        }

    </style>
</head>
<body>

    <!-- Вставляем аудиофайл -->
    <audio id="rickroll-audio" src="sounds/rickroll.mp3" autoplay loop>
        Ваш браузер не поддерживает воспроизведение аудио.
    </audio>

    <div id="song-container">
        <div class="song-text">———————————————————————</div>
        <div class="song-text">Never gonna give you up</div>
        <div class="song-text">Never gonna let you down</div>
        <div class="song-text">Never gonna run around and desert you</div>
        <div class="song-text">Never gonna make you cry</div>
        <div class="song-text">Never gonna say goodbye</div>
        <div class="song-text">Never gonna tell a lie and hurt you</div>
    </div>

    <div class="credits">
        <h2>Титры</h2>
        <span>Сайт создан:</span>
        <span>1. Dmitry</span>
        <span>Технологии:</span>
        <span>1. HTML</span>
        <span>2. CSS</span>
        <span>3. JavaScript</span>
    </div>

    
    <script>
        const songLines = document.querySelectorAll('.song-text');
        let delay = 0;

        // Задержка для появления каждой строки с анимацией
        songLines.forEach((line, index) => {
            setTimeout(() => {
                line.style.animationDelay = `${delay}s`; // Устанавливаем задержку для каждой строки
            }, delay * 500);  // Увеличиваем задержку для каждой строки
            delay += 1; // Увеличиваем задержку для каждой следующей строки (по 3 секунды)
        });

        // После исчезновения всех строк показываем титры
        setTimeout(function() {
            document.querySelector('.credits').style.display = 'block';
        }, delay * 1000); // Показываем титры после всех строк

        // Перенаправление на другую страницу
        setTimeout(function() {
            window.location.href = 'https://rivkos.github.io/GameHub/'; // Перенаправление через 12 секунд
        }, delay * 1000 + 18000); // Добавляем 5 секунд для показа титров
    </script>

</body>
</html>

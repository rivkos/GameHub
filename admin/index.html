<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница администратора</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
        }
        
        .song-text {
            font-size: 2em;
            color: red;
            text-align: center;
            margin: 50px 0;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        .credits {
            display: none;
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
            color: white;
        }

        .credits span {
            display: block;
            margin: 20px 0;
        }

        .redirect-message {
            font-size: 1.5em;
            color: white;
            text-align: center;
            margin-top: 100px;
        }
        
    </style>
</head>
<body>

    <!-- Вставляем аудиофайл -->
    <audio id="rickroll-audio" src="sounds/rickroll.mp3" autoplay loop>
        Ваш браузер не поддерживает воспроизведение аудио.
    </audio>

    <div id="song-container">
        <div class="song-text">Never gonna give you up</div>
        <div class="song-text">Never gonna let you down</div>
        <div class="song-text">Never gonna run around and desert you</div>
        <div class="song-text">Never gonna make you cry</div>
        <div class="song-text">Never gonna say goodbye</div>
        <div class="song-text">Never gonna tell a lie and hurt you</div>
        <div class="song-text">Походу рикролл :(</div>
    </div>

    <div class="credits">
        <h2>Титры</h2>
        <span>Сайт создан:</span>
        <span>1. Dmitry</span>
        <span>Технологии:</span>
        <span>1. HTML</span>
        <span>2. CSS</span>
        <span>3. JavaScript</span>
    </div>

    <div class="redirect-message">
        <p>Скоро...</p>
    </div>

    <script>
        const songLines = document.querySelectorAll('.song-text');
        let delay = 0;

        songLines.forEach((line, index) => {
            setTimeout(() => {
                line.style.opacity = 0; // Скрываем строку
            }, delay);
            delay += 3000; // Увеличиваем задержку между строками (по 3 секунды)
        });

        // После исчезновения всех строк показываем титры
        setTimeout(function() {
            document.querySelector('.credits').style.display = 'block';
        }, delay);

        // Перенаправление на другую страницу
        setTimeout(function() {
            window.location.href = 'https://rivkos.github.io/GameHub/'; // Перенаправление через 12 секунд
        }, delay + 5000); // Добавляем 5 секунд для показа титров
    </script>

</body>
</html>

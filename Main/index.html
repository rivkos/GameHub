<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка  сайта</title>
    <style>
        /* Общие стили */
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* Анимация титров */
        .title {
            font-size: 32px;
            text-align: center;
            color: white;
            opacity: 0;
            animation: titleFadeIn 3s ease-in-out forwards;
            z-index: 10;
            width: 100%;
            white-space: nowrap;
        }

        /* Эффект набора текста */
        .title span {
            display: inline-block;
            opacity: 0;
            animation: titleLetterFadeIn 1s ease-in-out forwards;
            font-weight: bold;
            color: red;
            margin: 0 2px;
        }

        @keyframes titleFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes titleLetterFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Анимация для перехода на полный экран */
        @keyframes fullScreenAnimation {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .animationFullScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: red;
            font-size: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fullScreenAnimation 3s ease-in-out forwards;
            opacity: 0;
            z-index: 20;
        }

        /* Защита от копирования */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Блокировка правой кнопки мыши */
        body {
            -webkit-touch-callout: none;
        }

        /* Стили для ссылки */
        .link {
            margin-top: 20px;
            color: white;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link:hover {
            color: yellow;
            text-shadow: 0 0 20px yellow, 0 0 30px yellow;
        }

        /* Анимация подсветки для ссылки */
        .link:focus {
            outline: none;
            box-shadow: 0 0 15px 5px red;
        }

        /* Фоновая анимация (космос) */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            z-index: -1;
            animation: spaceAnimation 30s infinite linear;
        }

        /* Анимация движения звезд */
        @keyframes spaceAnimation {
            0% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            }
            50% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(80, 0, 0, 1) 100%);
            }
            100% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            }
        }

        /* Всплывающее сообщение */
        .message {
            font-size: 24px;
            font-weight: bold;
            color: white;
            opacity: 0;
            animation: fadeInMessage 5s ease-in-out forwards;
            margin-top: 20px;
            z-index: 10;
        }

        @keyframes fadeInMessage {
            0% { opacity: 0; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="background"></div> <!-- Космический фон -->

    <div class="title">
        <span>Идет загрузка главной страницы... Пожалуйста подождите</span>
    </div>

    <div class="animationFullScreen hidden">
        XAC3
    </div>

    <a href="https://rivkos.github.io/GameHub/Bio/" class="link">Перейти к биографии Бориса</a>

    <div class="message hidden">
        Пожалуйста подождите, страница загружается...
    </div>

    <script>
        const title = document.querySelector('.title');
        const spans = title.querySelectorAll('span');
        const animationFullScreen = document.querySelector('.animationFullScreen');
        const message = document.querySelector('.message');

        const textQueue = [
            "Идет загрузка главной страницы... Пожалуйста подождите",
            "Сайт создан Димой в 2025 году",
            "А вы знали что тут есть биография Бориса?",
            "Мы как и Роскомнадзор надзорим весь интернет, проверяя ебанутые сервисы.",
            "Пожалуйста подождите еще...",
            "Без HTML, CSS и Java данный сайт был бы пустышкой",
            "Ожидайте, осталось еще немного...",
            "Загружаю страницу",
            "Подождите... Загружаю."
        ];

        let currentTextIndex = 0;

        function changeText() {
            // Очищаем предыдущий текст
            title.innerHTML = "";

            // Новый текст
            const newText = textQueue[currentTextIndex];
            const newTextElement = document.createElement('span');
            newTextElement.textContent = newText;
            title.appendChild(newTextElement);

            // Плавное появление нового текста
            newTextElement.style.animation = 'titleLetterFadeIn 1s ease-in-out forwards';
            newTextElement.style.animationDelay = '0s';

            // Увеличиваем индекс для следующего текста
            currentTextIndex = (currentTextIndex + 1) % textQueue.length;

            // Показ следующего титра через заданный интервал
            setTimeout(changeText, 5000); // Переход к следующему титру через 5 секунд
        }

        // Начать цикличную смену титров
        changeText();

        // Плавный переход XAC3 и исчезновение
        setTimeout(() => {
            animationFullScreen.classList.remove('hidden');
        }, 12000); // Показывается через 12 секунд

        setTimeout(() => {
            animationFullScreen.style.opacity = 0;
        }, 15000); // Исчезает через 15 секунд

        // Плавный переход на страницу
        setTimeout(() => {
            window.location.href = "https://rivkos.github.io/GameHub/main.html/";
        }, 17000); // Переход через 17 секунд

        // Показ сообщения
        setTimeout(() => {
            message.classList.remove('hidden');
        }, 3000); // Показывается через 3 секунды
    </script>

</body>
</html>

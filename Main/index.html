<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загружается... | Космос</title>
  <link rel="icon" href="https://img.icons8.com/ios-filled/50/ffffff/error.png" />
  <style>
    /* Общие стили */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Courier New', Courier, monospace;
      background: black;
      color: white;
      user-select: none;  /* Запрещаем выделение текста */
      overflow: hidden;
    }

    /* Атмосфера космоса */
    .stars, .stars2, .stars3 {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-repeat: repeat;
      z-index: -3;
      animation: moveStars 200s linear infinite;
    }
    .stars { background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 2px 2px; opacity: 0.3; }
    .stars2 { background-image: radial-gradient(#ff4d4d 1px, transparent 1px); background-size: 3px 3px; opacity: 0.2; }
    .stars3 { background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 1.5px 1.5px; opacity: 0.1; }

    @keyframes moveStars {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    .fog {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03), rgba(255,0,0,0.05));
      animation: fogMove 60s linear infinite;
      z-index: -2;
    }

    @keyframes fogMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Стили для терминала */
    .terminal-container {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 2px solid #ff4d4d;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      display: none; /* Скрыть по умолчанию */
    }

    .terminal {
      background-color: #000;
      color: #fff;
      font-size: 1.2em;
      line-height: 1.6em;
      white-space: pre-wrap;
      padding: 20px;
      font-family: 'Courier New', Courier, monospace;
      border: none;
      width: 100%;
      overflow-x: auto;
      border-radius: 5px;
      max-height: 300px;
    }

    .cursor {
      display: inline-block;
      width: 12px;
      height: 1.2em;
      background: #ff4d4d;
      margin-left: 5px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    /* Кнопки */
    .button-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 1.1em;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #ff1a1a;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Космический фон -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="fog"></div>

  <!-- Контейнер с терминалом -->
  <div class="terminal-container" id="terminalContainer">
    <div class="terminal" id="terminal">
      Подключение к серверу...<br>
      Ответ получен...<br>
      Загружаю титры...<br>
      Done...<br>
      Ожидаю действий пользователя... <br>
      <span class="cursor"></span>
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Введите команду..." autocomplete="off" autofocus>
      <button id="sendButton">Отправить</button>
    </div>
  </div>

  <!-- Кнопки управления -->
  <div class="button-container">
    <button id="openTerminalBtn">Открыть терминал</button>
    <button id="closeTerminalBtn" class="hidden">Закрыть терминал</button>
  </div>

  <script>
    // Блокировка контекстного меню и выделения
    document.addEventListener('mousedown', function(e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      const blockedKeys = ['u', 'c', 'x', 'v', 'a', 's'];
      if (e.ctrlKey && blockedKeys.includes(e.key.toLowerCase())) { e.preventDefault(); }
    });

    // Переключение терминала
    const openTerminalBtn = document.getElementById('openTerminalBtn');
    const closeTerminalBtn = document.getElementById('closeTerminalBtn');
    const terminalContainer = document.getElementById('terminalContainer');

    openTerminalBtn.addEventListener('click', () => {
      terminalContainer.style.display = 'block';
      openTerminalBtn.style.display = 'none';
      closeTerminalBtn.style.display = 'inline-block';
    });

    closeTerminalBtn.addEventListener('click', () => {
      terminalContainer.style.display = 'none';
      openTerminalBtn.style.display = 'inline-block';
      closeTerminalBtn.style.display = 'none';
    });

    // Динамическое отображение титров
    const titles = [
      'Идет загрузка главной страницы... Пожалуйста подождите',
      'Сайт создан Димой в 2025 году',
      'А вы знали, что тут есть биография Бориса? Нажмите на текст, чтобы перейти.',
      'Загружаю страницу... Пожалуйста подождите еще...',
      'Ожидайте, осталось немного...',
      'Титры завершены.'
    ];

    let titleIndex = 0;

    function displayTitle() {
      const titleElement = document.getElementById('title');
      if (titleIndex < titles.length) {
        titleElement.innerHTML = titles[titleIndex];
        titleElement.style.opacity = 1;
        titleIndex++;
        setTimeout(displayTitle, 5000);  // Следующий титр через 5 секунд
      }
    }
    displayTitle();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защищённый сайт</title>
    <style>
        /* Общие стили */
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            padding: 0 15px;
        }

        /* Анимация титров */
        .title {
            font-size: 24px;
            text-align: center;
            color: white;
            opacity: 0;
            animation: fadeInTitle 2s ease-out forwards;
            width: 100%;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.6);
        }

        @keyframes fadeInTitle {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Эффект подсветки */
        .highlight {
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333, 0 0 30px #ff3333;
        }

        /* Фоновая анимация (космос) */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            z-index: -1;
            animation: spaceAnimation 30s infinite linear;
        }

        @keyframes spaceAnimation {
            0% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            }
            50% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(80, 0, 0, 1) 100%);
            }
            100% {
                background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(40, 0, 0, 1) 100%);
            }
        }

        /* Защита от копирования */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Стили для ссылки */
        .link {
            margin-top: 20px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link:hover {
            color: #ff3333;
            text-shadow: 0 0 20px #ff3333, 0 0 30px #ff3333;
        }

        /* Анимация подсветки для ссылки */
        .link:focus {
            outline: none;
            box-shadow: 0 0 15px 5px red;
        }

        /* Стили для анимации появления титров */
        .hidden {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        /* Анимация появления титров */
        .title span {
            display: inline-block;
            opacity: 0;
            font-weight: bold;
            color: red;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .title span.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Плавное скрытие титров */
        .title span.hidden {
            opacity: 0;
            transform: translateY(50px);
        }

        /* Плавная анимация для перехода в XAC3 */
        .animationFullScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: red;
            font-size: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fullScreenAnimation 3s ease-in-out forwards;
            z-index: 20;
        }

        @keyframes fullScreenAnimation {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .title {
                font-size: 18px;
            }

            .link {
                font-size: 16px;
            }

            .animationFullScreen {
                font-size: 80px;
            }
        }

        /* Всплывающее сообщение */
        .message {
            font-size: 24px;
            font-weight: bold;
            color: white;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            margin-top: 20px;
        }

        .message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="background"></div> <!-- Космический фон -->

    <div class="title">
        <!-- Титры будут динамически вставляться сюда -->
    </div>

    <div class="animationFullScreen hidden">
        XAC3
    </div>

    <a href="https://rivkos.github.io/GameHub/Bio/" class="link">Перейти к биографии Бориса</a>

    <div class="message">
        Пожалуйста подождите, страница загружается...
    </div>

    <script>
        const title = document.querySelector('.title');
        const message = document.querySelector('.message');
        const animationFullScreen = document.querySelector('.animationFullScreen');
        const textQueue = [
            "Идет загрузка главной страницы... Пожалуйста подождите",
            "Сайт создан Димой в 2025 году",
            "А вы знали что тут есть биография Бориса?",
            "Мы как и Роскомнадзор надзорим весь интернет, проверяя ебанутые сервисы.",
            "Пожалуйста подождите еще...",
            "Без HTML, CSS и Java данный сайт был бы пустышкой",
            "Ожидайте, осталось еще немного...",
            "Загружаю страницу",
            "Титры закончились."
        ];

        let currentTextIndex = 0;

        function changeText() {
            title.innerHTML = ""; // Очистка текущего текста
            const text = textQueue[currentTextIndex];

            // Создание нового тега <span> для титра
            const span = document.createElement('span');
            span.textContent = text;
            title.appendChild(span);

            // Плавное появление титра
            setTimeout(() => {
                span.classList.add('visible');
            }, 50);

            // Скрытие титра после 4 секунд
            setTimeout(() => {
                span.classList.remove('visible');
                span.classList.add('hidden');
            }, 4000);

            // Переход к следующему титру через 4.5 секунды
            setTimeout(() => {
                currentTextIndex = (currentTextIndex + 1) % textQueue.length;
                changeText();
            }, 4500);
        }

        // Плавный старт титров
        setTimeout(changeText, 1000);

        // Показать XAC3 после титров
        setTimeout(() => {
            animationFullScreen.classList.remove('hidden');
        }, 12000); // Покажется через 12 секунд

        setTimeout(() => {
            animationFullScreen.style.opacity = 0;
        }, 15000); // Исчезнет через 15 секунд

        // Плавный переход на страницу
        setTimeout(() => {
            window.location.href = "https://rivkos.github.io/GameHub/main.html/";
        }, 17000); // Переход через 17 секунд

        // Показ сообщения
        setTimeout(() => {
            message.classList.add('visible');
        }, 3000); // Показ сообщения через 3 секунды
    </script>

</body>
</html>
